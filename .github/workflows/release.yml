# PUBLIC repo release workflow — lands in Anjadhe/Anjadhe as
# .github/workflows/release.yml (copied there by the private repo's mirror.yml).
# Do NOT rename it here; the mirror job places it at the right path.
#
# Triggered when mirror.yml force-pushes a `v*` tag to this repo. Builds the
# universal macOS DMG, signs + notarizes it (build.mac.notarize is true in
# package.json), and publishes a GitHub Release using the repo's own ephemeral
# GITHUB_TOKEN — no long-lived PAT is involved in publishing.
#
# Secrets to add in the PUBLIC repo (Settings > Secrets and variables > Actions):
#   ENV_PRODUCTION        — full contents of .env.production (the bundled Google
#                           OAuth client id/secret). Written to .env.production at
#                           build time so electron-builder bundles it. Already
#                           extractable from the shipped DMG, so this is not a new
#                           exposure — it just keeps it out of git.
#   MAC_CSC_LINK          — base64 of the Developer ID Application .p12 certificate
#   MAC_CSC_KEY_PASSWORD  — password for that .p12
#   APPLE_API_KEY_P8      — contents of the App Store Connect API key (.p8)
#   APPLE_API_KEY_ID      — the API key id
#   APPLE_API_ISSUER      — the API key issuer id
name: Build & publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # lets electron-builder create the GitHub Release via GITHUB_TOKEN

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Materialize build-time secrets
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          printf '%s' "$ENV_PRODUCTION" > .env.production
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, sign, notarize & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}          # publish to THIS repo's Releases
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8   # electron-builder notarize (API key)
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npx electron-builder --mac --publish always

      # electron-builder has twice exited 0 with its uploads unfinished
      # (v0.1.0-alpha.26 and .27), leaving a green build and a release carrying
      # nothing but a 0-byte blockmap: no DMG, no zip, no latest-mac.yml. A
      # release in that state looks published, cannot be downloaded, and
      # silently breaks auto-update, because the updater reads the zip named in
      # latest-mac.yml. Recovery used to be a manual delete-and-rerun.
      #
      # So: wait for uploads that may still be in flight, then repair anything
      # missing from the dist/ directory this job just built, and only then
      # decide whether the release is sound. Failing loudly is the floor;
      # repairing is possible because the artifacts are sitting right here.
      - name: Verify and repair published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          EXPECTED="Anjadhe.dmg Anjadhe.dmg.blockmap Anjadhe-${VERSION}-universal-mac.zip Anjadhe-${VERSION}-universal-mac.zip.blockmap latest-mac.yml"
          # A truncated upload is worse than an absent one: it looks complete.
          # The DMG and zip are ~220MB, so anything under 50MB is a bad upload.
          MIN_BIG=52428800

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::No release exists for $TAG — electron-builder did not create one."
            exit 1
          fi

          # Echoes the names that are absent, zero-byte, or implausibly small.
          bad_assets() {
            out=""
            for f in $EXPECTED; do
              size=$(gh release view "$TAG" --json assets \
                     -q ".assets[] | select(.name==\"$f\") | .size" 2>/dev/null || true)
              if [ -z "$size" ] || [ "$size" = "0" ]; then
                out="$out $f"
              else
                case "$f" in
                  *.dmg|*.zip) [ "$size" -lt "$MIN_BIG" ] && out="$out $f" ;;
                esac
              fi
            done
            echo "$out"
          }

          for attempt in 1 2 3 4 5 6; do
            BAD=$(bad_assets)
            [ -z "$BAD" ] && break
            echo "attempt $attempt/6 — not yet uploaded:$BAD"
            sleep 20
          done

          BAD=$(bad_assets)
          if [ -n "$BAD" ]; then
            echo "Repairing from dist/ —$BAD"
            for f in $BAD; do
              if [ -f "dist/$f" ]; then
                echo "  uploading $f"
                gh release upload "$TAG" "dist/$f" --clobber
              else
                echo "::error::dist/$f does not exist — the build did not produce it."
                exit 1
              fi
            done
          fi

          BAD=$(bad_assets)
          if [ -n "$BAD" ]; then
            echo "::error::Release $TAG is incomplete after repair —$BAD"
            exit 1
          fi

          echo "All 5 assets present on $TAG:"
          gh release view "$TAG" --json assets -q '.assets[] | "  \(.name)  \(.size) bytes"'
