<!-- Finance views — appended to #app-views by BundledApps (manifest.json `view`):
     the Portfolio overview plus the ticker / property / liability / transaction /
     snapshots pages the app routes between, and (at the end) the Spending view.
     One app to the person ("Finance", 2026-10-05); two app ids inside. -->
<!-- Portfolio View — one page. A left nav of accounts scopes the
     right pane: "All Accounts" or one account. There is no separate
     account-detail view any more; PortfolioApp.openAccountDetail
     just changes the scope. -->
<div id="portfolio-view" class="view app-view app-view-full">
    <div class="app-header-bar">
        <div class="email-header-left">
            <button id="portfolio-sidebar-toggle" class="email-sidebar-toggle" type="button" title="Toggle accounts sidebar" aria-label="Toggle accounts sidebar"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>
            <h2 class="app-view-title">
                <span id="portfolio-breadcrumb" class="app-breadcrumb">Finance</span>
            </h2>
        </div>
        <div class="editor-actions">
            <button id="portfolio-toggle-values" class="secondary-btn portfolio-icon-btn" title="Hide values" aria-label="Hide values">
                <svg class="portfolio-eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="portfolio-eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
            <!-- Account actions appear only when one account is selected -->
            <button id="portfolio-account-drift-btn" class="secondary-btn" hidden title="Positions that differ from your brokerage"></button>
            <button id="portfolio-account-sync-btn" class="secondary-btn" hidden title="Pull holdings and transactions from your brokerage now">Sync now</button>
            <button id="portfolio-account-cash-btn" class="secondary-btn" hidden>Cash</button>
            <button id="portfolio-account-edit-btn" class="secondary-btn" hidden>Edit</button>
            <button id="portfolio-account-delete-btn" class="secondary-btn" hidden>Delete</button>
            <button id="portfolio-more-btn" class="secondary-btn portfolio-icon-btn" title="More actions" aria-label="More actions" aria-haspopup="menu" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
            </button>
            <button id="portfolio-add-transaction-btn" class="primary-btn">+ Transaction</button>
        </div>
    </div>

    <div class="portfolio-layout">
        <!-- The old accounts nav and its resizer: empty and hidden since the
             calm pass (2026-10-06; the places replaced it). Kept only
             because the resizer and sidebar-state code still look them up. -->
        <nav id="portfolio-nav" class="portfolio-nav" aria-label="Accounts"></nav>
        <div id="portfolio-nav-resizer" class="actions-nav-resizer" role="separator"
             aria-orientation="vertical" aria-label="Resize sidebar"
             title="Drag to resize &mdash; double-click to reset"></div>

        <div class="portfolio-main">
            <!-- Investments | Spending tabs, then Investments' page words
                 (Overview · Strategy; Tickers and Watchlist left 2026-10-09).
                 First in the column so every page of the half wears them
                 (PortfolioUI.renderFinanceTabs). -->
            <div id="finance-tabs-investments" class="finance-tabs"></div>
            <!-- Strategy scope: the AI-native strategy page replaces the
                 whole pane (PortfolioStrategyPage; .strategy-scope on
                 .portfolio-main hides the account machinery below). -->
            <div id="portfolio-strategy-page" class="portfolio-strategy-page" hidden></div>
            <!-- The lede (calm pass, 2026-10-06): what the number is and how
                 fresh the prices are, one small line over the masthead. -->
            <p class="pf-lede"><span id="portfolio-lede-what"></span><span id="portfolio-prices-asof" class="portfolio-prices-asof" title="When stock prices were last fetched"></span></p>
            <!-- Account scope: name + type above the masthead -->
            <div id="portfolio-scope-header" class="portfolio-account-header" hidden>
                <h2 id="portfolio-account-name"></h2>
                <span id="portfolio-account-type-display" class="portfolio-account-type-label"></span>
                <div id="portfolio-account-linked" class="portfolio-account-linked" hidden></div>
            </div>
            <!-- Hero (2026-09-09 redesign): the masthead and the value chart
                 side by side in one card, the strategy line across its foot. -->
            <div class="portfolio-hero">
                <div id="portfolio-summary" class="portfolio-masthead">
                    <!-- Summary masthead rendered here -->
                </div>
                <div id="portfolio-value-chart" class="portfolio-chart-container">
                    <!-- Value history chart rendered here -->
                </div>
            </div>
            <!-- Where the money is (calm pass, 2026-10-06): accounts, tickers,
                 property and debt as Settings-style rows. They replaced the
                 left nav; at an account scope the breadcrumb is the way back.
                 Rendered by PortfolioUI.renderPlaces, All Accounts only. -->
            <div id="portfolio-places" class="pf-places"></div>
            <!-- The plan and its verdict as one row; a click opens it.
                 Rendered by PortfolioUI.renderStrategyLine. -->
            <div id="portfolio-strategy-card" class="pf-strategy-row"></div>
            <div class="portfolio-tabs">
                <button id="portfolio-holdings-tab" class="portfolio-tab active">Holdings</button>
                <button id="portfolio-txns-tab" class="portfolio-tab">Transactions</button>
            </div>
            <div id="portfolio-holdings">
                <!-- Holdings table or transaction list rendered here -->
            </div>
            <!-- The assistant's box (2026-10-09, PageChat): the overview's
                 chat at All Accounts, the account's own when scoped. It
                 replaced "Add a note" and the Decisions list. -->
            <div id="portfolio-chat" class="pf-chat"></div>
            <!-- Notes linked before 2026-10-09, read-only rows; hidden when
                 none (PortfolioUI.renderLinkedNotes). -->
            <div id="portfolio-notes" class="portfolio-notes-section" hidden></div>
        </div>
    </div>
</div>

<!-- Portfolio Ticker Detail View -->
<div id="portfolio-ticker-view" class="view app-view">
    <div class="app-header-bar">
        <h2 class="app-view-title">
            <span id="portfolio-ticker-breadcrumb" class="app-breadcrumb"></span>
        </h2>
    </div>
    <div id="portfolio-ticker-content" class="portfolio-ticker-layout">
        <!-- Ticker detail rendered here -->
    </div>
</div>

<!-- Portfolio Property Detail View -->
<div id="portfolio-property-view" class="view app-view">
    <div class="app-header-bar">
        <h2 class="app-view-title">
            <span id="portfolio-property-breadcrumb" class="app-breadcrumb"></span>
        </h2>
    </div>
    <div id="portfolio-property-content" class="portfolio-ticker-layout">
        <!-- Property detail rendered here -->
    </div>
</div>

<!-- Portfolio Liability Detail View (mortgage / loan) -->
<div id="portfolio-liability-view" class="view app-view">
    <div class="app-header-bar">
        <h2 class="app-view-title">
            <span id="portfolio-liability-breadcrumb" class="app-breadcrumb"></span>
        </h2>
    </div>
    <div id="portfolio-liability-content" class="portfolio-ticker-layout">
        <!-- Liability detail rendered here -->
    </div>
</div>

<!-- Portfolio Transaction Editor View -->
<div id="portfolio-transaction-view" class="view app-view">
    <div class="editor-header">
        <h2 class="app-view-title">
            <span id="portfolio-transaction-breadcrumb" class="app-breadcrumb"></span>
        </h2>
    </div>

    <!-- The transaction sheet (2026-10-01): the task sheet's recipe — a
         head with the kind switches and actions, a headline that reads the
         order back as a sentence (PortfolioUI.updateTxnPreview), a compact
         two-column property list, the live total, and notes. Every input
         id is unchanged; saveTransaction reads them as before. -->
    <div class="portfolio-editor-main txn-sheet">
        <div class="txn-sheet-head">
            <div class="txn-seg" role="radiogroup" aria-label="Kind">
                <input type="radio" name="txn-type" id="txn-type-buy" value="buy" checked>
                <label for="txn-type-buy">Buy</label>
                <input type="radio" name="txn-type" id="txn-type-sell" value="sell">
                <label for="txn-type-sell">Sell</label>
                <input type="radio" name="txn-type" id="txn-type-holding" value="holding">
                <label for="txn-type-holding">Holding</label>
            </div>
            <div class="txn-seg txn-seg--quiet" role="radiogroup" aria-label="Asset">
                <input type="radio" name="txn-asset" id="txn-asset-stock" value="stock" checked>
                <label for="txn-asset-stock">Stock</label>
                <input type="radio" name="txn-asset" id="txn-asset-option" value="option">
                <label for="txn-asset-option">Option</label>
            </div>
            <div class="txn-head-right">
                <span id="txn-save-status" class="save-indicator" data-state="idle" aria-live="polite"><span class="save-indicator-icon" aria-hidden="true"></span><span class="save-indicator-label"></span></span>
                <button id="portfolio-transaction-delete-btn" type="button" class="quiet-link-btn txn-delete-btn" style="display: none;">Delete</button>
                <button id="portfolio-transaction-save-btn" type="button" class="primary-btn">Save</button>
            </div>
        </div>

        <h1 id="txn-headline" class="txn-headline">New transaction</h1>
        <p id="txn-type-hint" class="txn-form-hint" hidden>Records shares you already own at their average cost. Cash is not affected.</p>

        <div class="txn-props">
            <div class="txn-prop">
                <label for="txn-account-select">Account</label>
                <select id="txn-account-select">
                    <option value="">Select account...</option>
                </select>
            </div>
            <div class="txn-prop" id="txn-ticker-group">
                <label for="txn-ticker-input">Ticker</label>
                <input type="text" id="txn-ticker-input" placeholder="AAPL" autocomplete="off">
            </div>
            <div class="txn-prop" id="txn-underlying-group" hidden>
                <label for="txn-opt-underlying">Underlying</label>
                <input type="text" id="txn-opt-underlying" placeholder="AAPL" autocomplete="off">
            </div>
            <!-- Option contract fields (shown when asset = Option) -->
            <div class="txn-props-sub" id="txn-option-row" hidden>
                <div class="txn-prop">
                    <label>Contract</label>
                    <div class="txn-seg txn-seg--quiet">
                        <input type="radio" name="txn-opt-type" id="txn-opt-call" value="call" checked>
                        <label for="txn-opt-call">Call</label>
                        <input type="radio" name="txn-opt-type" id="txn-opt-put" value="put">
                        <label for="txn-opt-put">Put</label>
                    </div>
                </div>
                <div class="txn-prop">
                    <label for="txn-opt-strike">Strike</label>
                    <input type="number" id="txn-opt-strike" placeholder="250" min="0" step="0.01">
                </div>
                <div class="txn-prop">
                    <label for="txn-opt-expiration">Expires</label>
                    <input type="date" id="txn-opt-expiration">
                </div>
            </div>
            <div class="txn-prop">
                <label for="txn-quantity-input" id="txn-quantity-label">Shares</label>
                <input type="number" id="txn-quantity-input" placeholder="10" min="0" step="any">
            </div>
            <div class="txn-prop">
                <label for="txn-price-input" id="txn-price-label">Price</label>
                <span class="txn-prop-value">
                    <input type="number" id="txn-price-input" placeholder="150.00" min="0" step="0.01">
                    <button type="button" id="txn-use-price-btn" class="quiet-link-btn txn-use-price-btn" hidden>Use current</button>
                </span>
            </div>
            <div class="txn-prop">
                <label for="txn-date-input">Date</label>
                <input type="date" id="txn-date-input">
            </div>
        </div>
        <p id="txn-owned-hint" class="txn-form-hint" hidden></p>
        <p id="txn-premium-hint" class="txn-form-hint" hidden>The quoted per-share premium. One contract covers 100 shares, so cost = contracts &times; premium &times; 100.</p>
        <!-- Live math: what this order costs and where cash lands.
             Filled by PortfolioUI.updateTxnPreview as fields change. -->
        <div id="txn-summary" class="txn-summary" hidden></div>
        <textarea id="txn-notes-input" class="txn-notes" rows="2" placeholder="Add a note…"></textarea>
    </div>
</div>

<!-- Portfolio Snapshots View -->
<div id="portfolio-snapshots-view" class="view app-view">
    <div class="app-header-bar">
        <h2 class="app-view-title">
            <span id="portfolio-snapshots-breadcrumb" class="app-breadcrumb"></span>
        </h2>
        <div class="editor-actions">
            <button id="portfolio-snapshots-take-btn" class="secondary-btn">Take snapshot</button>
        </div>
    </div>
    <div id="portfolio-snapshots-chart" class="portfolio-chart-container">
        <!-- Chart rendered here -->
    </div>
    <div id="portfolio-snapshots-table">
        <!-- Snapshot table rendered here -->
    </div>
</div>

<!-- Spending view (the Finance app's other half since 2026-10-05; app id
     `spending` kept, reached from Finance's left nav, no tile of its own).
     The same recipe: a left nav of PAGES (Overview, Categories, Merchants,
     Recurring, Transactions) and ACCOUNTS (a scope that applies to every
     page) beside the main column. Header chrome only; the nav and the page
     are rendered by SpendingUI. Every door is behind the `brokerage`
     feature flag (SpendingSync.available()). -->
<div id="spending-view" class="view app-view app-view-full">
    <div class="app-header-bar">
        <div class="email-header-left">
            <button id="spending-sidebar-toggle" class="email-sidebar-toggle" type="button" title="Toggle sidebar" aria-label="Toggle sidebar"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>
            <h2 class="app-view-title">
                <span id="spending-breadcrumb" class="app-breadcrumb">Finance</span>
            </h2>
        </div>
        <div class="app-header-actions">
            <!-- No help button yet: the help corpus mirrors to the public site at
                 release, and this feature is unannounced. Add the article with the flag flip. -->
            <!-- Settings gear → Settings › Accounts › Linked institutions (AppManager.openAppSettings). -->
            <button class="icon-btn app-settings-btn" data-settings-for="spending" title="Spending settings" aria-label="Spending settings"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
            <button id="spending-sync-btn" class="secondary-btn" title="Pull the latest transactions from your linked banks and cards" hidden>Sync now</button>
            <button id="spending-link-btn" class="secondary-btn" title="Connect a bank or credit card through nenva cloud">+ Link a bank or card</button>
        </div>
    </div>
    <div class="spending-layout">
        <nav id="spending-nav" class="spending-nav" aria-label="Spending sections and accounts"></nav>
        <div id="spending-nav-resizer" class="actions-nav-resizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" title="Drag to resize &mdash; double-click to reset"></div>
        <div id="spending-body" class="spending-main"></div>
    </div>
</div>
