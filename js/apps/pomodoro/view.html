<!-- Pomodoro view — appended to #app-views by BundledApps (manifest.json `view`). -->
<div id="pomodoro-view" class="view app-view">
    <div class="app-header-bar">
        <h2 class="app-view-title">
            <span id="pomodoro-breadcrumb" class="app-breadcrumb">Pomodoro</span>
        </h2>

             then settings. Both keep their own id-bound handlers —
             Pomodoro's help is its own explainer and its settings is
             an inline panel, so neither carries the data-help-for /
             data-settings-for hook the delegated handlers key on. -->
        <div class="app-header-actions">
            <button id="pomodoro-help-btn" class="icon-btn app-help-btn" type="button" title="About the Pomodoro Technique" aria-label="About the Pomodoro Technique"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.3 9.3a2.7 2.7 0 0 1 5.4.6c0 1.8-2.7 2.1-2.7 3.6"/><line x1="12" y1="16.8" x2="12" y2="16.81"/></svg></button>
